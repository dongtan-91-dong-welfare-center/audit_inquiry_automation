[project]
name = "audit-inquiry-automation"
version = "0.1.0"
description = ""
authors = [
    {name = "PDW-Accountant",email = "kkk273@naver.com"}
]

license = {text = "DONGTAN 91-DONG WELFARE CENTER"}
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "paddlepaddle (>=2.6.0,<3.0.0)",
    "paddleocr (>=2.7.0)",
    "numpy (<2.0.0)",
    "protobuf (>=3.20.0,<4.0.0)",
    "pydantic (>=1.10,<2.0.0)",
    "pytest (>=9.0.2,<10.0.0)",
    "openpyxl (>=3.1.0,<4.0.0)",

    # OpenCV 버전을 numpy 1.x와 호환되는 4.9.x 버전대로 낮춥니다.
    "opencv-python (>=4.9.0,<4.10.0)"
]

[tool.poetry]
package-mode = false

[dependency-groups]
dev = [
    "streamlit (>=1.54.0,<2.0.0)"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
# pytest 실행 시 현재 디렉토리(루트)를 PYTHONPATH에 추가
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "unit: Mock을 사용하는 가벼운 단위 테스트",
    "integration: 실제 PDF 파일을 사용하는 무거운 통합 테스트"
]
