[tool.poetry]
name = "audit_inquiry_automation"
version = "0.1.0"
description = "Automated PDF Extraction Tool for inquiry (Python Service)"
authors = ["qldrh112 <didie8520@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.11, <4.0.0"
streamlit = "^1.33.0"
pdfplumber = "^0.10.4"
pandas = "^2.2.1"
openpyxl = "^3.1.2"

[tool.poetry.group.dev.dependencies]
pytest = "^8.1.1"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"